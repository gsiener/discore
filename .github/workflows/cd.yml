name: CD - Deploy to Cloudflare

# Runs after CI passes instead of on push, so the test suite runs once
# (in CI) rather than twice. A single build job produces both artifacts;
# the two deploys then run in parallel with no install or rebuild.
on:
  workflow_run:
    workflows: ['CI - Test']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: true

jobs:
  build:
    name: Build release artifacts
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared + rankings packages
        run: |
          npm run build --workspace=@scorebot/shared
          npm run build --workspace=@scorebot/rankings

      - name: Build bot bundle
        working-directory: packages/bot
        run: node build.js

      # Pages deployments replace the whole site. Preserve the gitignored
      # rankings payload from production before building so a code deploy
      # cannot remove the published rankings and legacy supporting pages.
      - name: Hydrate published rankings
        working-directory: packages/web
        run: |
          set -euo pipefail
          base_url="https://score.kcuda.org/rankings"
          cache_bust="$(date +%s%N)"

          mkdir -p public/rankings/2025-26

          for file in \
            graph_boys.html graph_girls.html sources.html \
            hsni.html hsni-film.html hsni-field-map.png
          do
            curl --fail --location --silent --show-error --retry 3 \
              "${base_url}/${file}?cb=${cache_bust}" \
              --output "public/rankings/${file}"
            test -s "public/rankings/${file}"
          done

          for file in data_boys.json data_girls.json
          do
            curl --fail --location --silent --show-error --retry 3 \
              "${base_url}/2025-26/${file}?cb=${cache_bust}" \
              --output "public/rankings/2025-26/${file}"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" \
              "public/rankings/2025-26/${file}"
          done

          # The new season is optional until its first Drive export is published.
          mkdir -p public/rankings/2026-27
          for file in data_boys.json data_girls.json
          do
            if curl --fail --location --silent --show-error --retry 3 \
              "${base_url}/2026-27/${file}?cb=${cache_bust}" \
              --output "public/rankings/2026-27/${file}" \
              && node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" \
                "public/rankings/2026-27/${file}"
            then
              echo "Hydrated 2026-27/${file}"
            else
              rm -f "public/rankings/2026-27/${file}"
            fi
          done

      - name: Build web
        working-directory: packages/web
        run: npm run build

      - name: Upload bot bundle
        uses: actions/upload-artifact@v4
        with:
          name: bot-dist
          path: packages/bot/dist/index.js
          retention-days: 1

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 1

  deploy-worker:
    name: Deploy Worker to Cloudflare
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download bot bundle
        uses: actions/download-artifact@v4
        with:
          name: bot-dist
          path: packages/bot/dist

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'packages/bot'
          command: deploy dist/index.js

  deploy-web:
    name: Deploy Web to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'packages/web'
          command: pages deploy dist --project-name=scorebot
