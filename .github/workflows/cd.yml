name: CD - Deploy to Cloudflare

# Deploys the exact artifacts CI tested: both dists are built and
# uploaded by the CI run, so the deploys download them and ship —
# no second install, no rebuild. (To redeploy, re-run the CI run.)
on:
  workflow_run:
    workflows: ['CI - Test']
    types: [completed]
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: Deploy Worker to Cloudflare
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download bot bundle
        uses: actions/download-artifact@v4
        with:
          name: bot-dist
          path: packages/bot/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'packages/bot'
          command: deploy dist/index.js

  deploy-web:
    name: Deploy Web to Cloudflare Pages
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'packages/web'
          command: pages deploy dist --project-name=scorebot
