<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rankings - Discore</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./rankings-style.css" />
  </head>
  <body>
    <div id="app">
      <nav class="nav rk-nav">
        <div class="rk-nav-left">
          <h1>Discore</h1>
          <div class="rk-tabs" role="navigation" aria-label="Rankings views">
            <button class="rk-tab rk-tab-active" type="button" id="tb-rankings">Rankings</button>
            <button class="rk-tab" type="button" id="tb-teams">Teams</button>
            <button class="rk-tab" type="button" id="tb-tournaments">Tournaments</button>
          </div>
        </div>
        <div class="rk-nav-right">
          <input id="header-search" class="rk-search" type="search" placeholder="Search teams..." aria-label="Search teams" />
          <div class="nav-links">
            <a href="/simulate.html" class="nav-link">Simulate</a>
            <a href="/lab.html" class="nav-link">Lab</a>
          </div>
          <button id="theme-toggle" class="rk-icon-btn" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
        </div>
      </nav>

      <main id="main-content" class="rk-main">
        <p class="rk-meta" id="rk-meta"></p>

        <section class="rk-card" aria-label="Rankings filters">
          <div class="rk-card-row">
            <div class="rk-segmented" role="group" aria-label="Division">
              <button class="rk-seg rk-seg-active" type="button" data-division="boys">Boys</button>
              <button class="rk-seg" type="button" data-division="girls">Girls</button>
            </div>
            <select class="rk-select" id="season-select" aria-label="Season">
              <option value="2026-27" selected>2026-27</option>
            </select>
            <button id="hide-provisional" class="rk-toggle" type="button" aria-pressed="true">Show provisional</button>
          </div>
        </section>

        <div class="rk-viewtabs" role="tablist" aria-label="Rankings views" id="standings-viewtabs">
          <button id="tab-standings" class="rk-viewtab rk-viewtab-active" type="button" role="tab" aria-selected="true">Standings</button>
          <button id="tab-connectivity" class="rk-viewtab" type="button" role="tab" aria-selected="false">Connectivity</button>
        </div>

        <div id="standings-view" role="tabpanel">
          <div class="rk-table-wrap">
            <table class="rk-table rk-table-standings">
              <colgroup>
                <col class="col-rank" /><col class="col-team" /><col class="col-status" />
                <col class="col-rating" /><col class="col-delta" /><col class="col-trend" />
                <col class="col-record" /><col class="col-sos" /><col class="col-gp" /><col class="col-conf" />
              </colgroup>
              <thead><tr>
                <th><button id="sort-rank" class="rk-sort" type="button"># <span id="sort-arrow">↑</span></button></th>
                <th>Team</th><th>Status</th><th>Rating</th><th>Δ</th><th>Trend</th>
                <th class="num">Record</th><th>SoS</th><th>GP</th><th>Conf</th>
              </tr></thead>
              <tbody id="rankings-body"></tbody>
            </table>
          </div>
        </div>

        <div id="connectivity-view" role="tabpanel" class="hidden">
          <div id="components-list"></div>
        </div>

        <div id="teams-view" class="hidden">
          <div class="rk-table-wrap">
            <table class="rk-table rk-table-teams">
              <colgroup>
                <col class="col-team" /><col class="col-status" /><col class="col-rating" />
                <col class="col-record" /><col class="col-sos" /><col class="col-conf" />
              </colgroup>
              <thead><tr>
                <th>Team</th><th>Status</th><th class="num">Rating</th><th class="num">W-L</th><th class="num">SoS</th><th>Conf</th>
              </tr></thead>
              <tbody id="teams-body"></tbody>
            </table>
          </div>
        </div>

        <div id="tournaments-view" class="hidden">
          <h2 class="rk-results-title">Tournaments &amp; results</h2>
          <div id="tournaments-body" class="rk-tournament-list"></div>
        </div>

        <div id="team-view" class="hidden">
          <p class="rk-back-row"><a href="#" id="back-link" class="rk-back-link">&larr; Back to standings</a></p>
          <h2 id="team-name"></h2>
          <div id="team-summary" class="team-summary"></div>
          <div class="rk-table-wrap">
            <table class="rk-table">
              <thead><tr>
                <th>Opponent</th><th>Date</th><th>Result</th><th>Game rating</th><th>Effect</th>
                <th>Weights (S/D/X)</th><th>Status</th>
              </tr></thead>
              <tbody id="team-games-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./rankings.ts"></script>
  </body>
</html>
