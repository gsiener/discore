<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discore - Live Ultimate Frisbee Scores</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <nav class="nav">
        <h1>Discore</h1>
        <div class="nav-links">
          <a href="/games.html" class="nav-link">All Games</a>
          <a href="/stats.html" class="nav-link">Advanced Stats</a>
        </div>
      </nav>

      <main id="main-content">
        <div id="game-selector">
          <label for="game-select">Select Game:</label>
          <select id="game-select">
            <option value="">Loading games...</option>
          </select>
        </div>

        <div id="game-view" class="hidden">
          <div class="game-meta">
            <div id="game-date" class="game-date"></div>
            <a id="game-video-link" class="game-video-link hidden" target="_blank" rel="noopener noreferrer">Watch Video</a>
          </div>

          <div class="game-header">
            <div class="team-section team-left">
              <h2 id="team-us" class="team-name">Our Team</h2>
            </div>
            <div class="score-section">
              <div class="score-display">
                <span id="score-us" class="score">0</span>
                <span class="score-separator">-</span>
                <span id="score-them" class="score score-secondary">0</span>
              </div>
              <div id="game-status-badge" class="status-badge">Not Started</div>
            </div>
            <div class="team-section team-right">
              <h2 id="team-them" class="team-name">Their Team</h2>
            </div>
          </div>

          <div id="progression-table-container" class="progression-table-container">
            <table id="progression-table" class="progression-table">
              <thead>
                <tr>
                  <th>Team</th>
                </tr>
              </thead>
              <tbody>
              </tbody>
            </table>
          </div>

          <div id="efficiency-stats-container" class="game-summary hidden">
            <div class="gs-title">Game Summary</div>
            <div class="gs-header">
              <div class="gs-team gs-team-us">
                <span id="gs-team-us" class="gs-team-name">Us</span>
                <span id="gs-score-us" class="gs-score">0</span>
              </div>
              <div class="gs-team gs-team-them">
                <span id="gs-score-them" class="gs-score">0</span>
                <span id="gs-team-them" class="gs-team-name">Them</span>
              </div>
            </div>
            <div class="gs-body" id="gs-body"></div>
          </div>

          <details id="lineup-table-container" class="lineup-table-container hidden">
            <summary><h3>Lineups</h3></summary>
            <div class="lineup-table-scroll">
              <table id="lineup-table" class="lineup-table">
                <thead>
                  <tr></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </details>

          <div class="timeline-container">
            <h3>Timeline</h3>
            <div id="timeline" class="timeline">
              <p class="empty-state">No events yet</p>
            </div>
          </div>
        </div>

        <div id="error-view" class="hidden error-message">
          <p id="error-text"></p>
        </div>
      </main>

      <footer>
        <p>Updates every 3 seconds</p>
      </footer>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
