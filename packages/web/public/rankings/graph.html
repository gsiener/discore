  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #graph-container { width: 100vw; height: 100vh; }
    svg { display: block; }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: linear-gradient(180deg, rgba(26,26,46,0.95) 0%, rgba(26,26,46,0.7) 80%, rgba(26,26,46,0) 100%);
      padding: 16px 24px 32px; pointer-events: none;
    }
    header * { pointer-events: auto; }
    header h1 { font-size: 22px; font-weight: 700; color: #fff; }
    header .subtitle { font-size: 13px; color: #8a8a9e; margin-top: 2px; }
    header .back-link { font-size: 13px; color: #6c9bff; text-decoration: none; display: inline-block; margin-top: 6px; }
    header .back-link:hover { text-decoration: underline; }

    .controls {
      position: fixed; top: 16px; right: 24px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    .controls button, .controls label {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
      color: #ccc; padding: 6px 14px; border-radius: 6px; font-size: 12px;
      cursor: pointer; user-select: none; backdrop-filter: blur(8px);
    }
    .controls button:hover, .controls label:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .controls button.active { background: rgba(100,140,255,0.3); border-color: #6c9bff; color: #fff; }
    .controls label { display: flex; align-items: center; gap: 6px; }
    .controls input[type=checkbox] { accent-color: #6c9bff; }

    .legend {
      position: fixed; bottom: 16px; left: 24px; z-index: 10;
      background: rgba(26,26,46,0.92); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 12px 16px; max-height: 40vh; overflow-y: auto;
      backdrop-filter: blur(8px); font-size: 12px; min-width: 200px; max-width: 320px;
    }
    .legend h3 { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; line-height: 1.3; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .legend-label { color: #b0b0c0; }

    .tooltip {
      position: fixed; z-index: 100; pointer-events: none;
      background: rgba(10,10,25,0.95); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #e0e0e0;
      max-width: 320px; line-height: 1.5; backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: none;
    }
    .tooltip .tt-name { font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 4px; }
    .tooltip .tt-stat { color: #8a8a9e; }
    .tooltip .tt-stat span { color: #e0e0e0; font-weight: 600; }
    .tooltip .tt-games { margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }
    .tooltip .tt-game-line { color: #b0b0c0; }
    .tt-w { color: #4caf50; font-weight: 600; }
    .tt-l { color: #e57373; font-weight: 600; }
  </style>
</head>

    // --- Build graph ---
    const teams = DATA.teams;
    const teamMap = new Map(teams.map(t => [t.name, t]));

    // Build edges
    const edgeKey = (a, b) => [a, b].sort().join("|||");
    const edgeMap = new Map();

    teams.forEach(team => {
      team.games.forEach(g => {
        const k = edgeKey(team.name, g.opponent);
        if (!edgeMap.has(k)) {
          edgeMap.set(k, { source: team.name, target: g.opponent, games: [] });
        }
        edgeMap.get(k).games.push({
          ...g,
          player: team.name
        });
      });
    });

    const edges = [...edgeMap.values()];

    // Build adjacency for connected components
    const adj = new Map();
    teams.forEach(t => adj.set(t.name, new Set()));
    edges.forEach(e => {
      if (adj.has(e.source) && adj.has(e.target)) {
        adj.get(e.source).add(e.target);
        adj.get(e.target).add(e.source);
      }
    });

    // BFS connected components
    const visited = new Set();
    const components = [];
    teams.forEach(t => {
      if (visited.has(t.name)) return;
      const comp = [];
      const queue = [t.name];
      visited.add(t.name);
      while (queue.length) {
        const node = queue.shift();
        comp.push(node);
        (adj.get(node) || []).forEach(nb => {
          if (!visited.has(nb)) { visited.add(nb); queue.push(nb); }
        });
      }
      components.push(comp);
    });

    // Sort components by size descending
    components.sort((a, b) => b.length - a.length);

    // Assign cluster index to each team
    const clusterOf = new Map();
    components.forEach((comp, i) => comp.forEach(name => clusterOf.set(name, i)));

    // Determine tournaments per cluster
    const clusterTournaments = new Map();
    components.forEach((comp, i) => {
      const tourneys = new Set();
      comp.forEach(name => {
        const t = teamMap.get(name);
        if (t) t.games.forEach(g => tourneys.add(g.tournament));
      });
      clusterTournaments.set(i, [...tourneys].sort());
    });

    // Detect bridge teams (teams that played in tournaments spanning multiple clusters)
    const tournamentTeams = new Map();
    teams.forEach(t => {
      const tourneys = new Set(t.games.map(g => g.tournament));
      tourneys.forEach(tn => {
        if (!tournamentTeams.has(tn)) tournamentTeams.set(tn, new Set());
        tournamentTeams.get(tn).add(t.name);
      });
    });

    // A bridge team plays in 2+ tournaments that belong to different clusters
    const bridgeTeams = new Set();
    teams.forEach(t => {
      const tourneys = [...new Set(t.games.map(g => g.tournament))];
      const clusters = new Set(tourneys.map(tn => {
        // find any opponent in that tournament and get their cluster
        const game = t.games.find(g => g.tournament === tn);
        if (game && clusterOf.has(game.opponent)) return clusterOf.get(game.opponent);
        return clusterOf.get(t.name);
      }));
      if (clusters.size > 1 || tourneys.length > 1) bridgeTeams.add(t.name);
    });

    glowFilter.append("feGaussianBlur").attr("stdDeviation", "4").attr("result", "blur");
    glowFilter.append("feFlood").attr("flood-color", "#ffd700").attr("flood-opacity", "0.7").attr("result", "color");
    glowFilter.append("feComposite").attr("in", "color").attr("in2", "blur").attr("operator", "in").attr("result", "shadow");
    const glowMerge = glowFilter.append("feMerge");
    glowMerge.append("feMergeNode").attr("in", "shadow");
    glowMerge.append("feMergeNode").attr("in", "SourceGraphic");

    // Links
    const linkGroup = g.append("g").attr("class", "links");
    const linkElements = linkGroup.selectAll("line")
      .data(links)
      .join("line")
      .attr("stroke", "rgba(255,255,255,0.12)")
      .attr("stroke-width", d => Math.max(0.5, Math.min(d.weight * 1.2, 5)));

    // Node group
    const nodeGroup = g.append("g").attr("class", "nodes");
    const nodeElements = nodeGroup.selectAll("g")
      .data(nodes)
      .join("g")
      .attr("class", "node")
      .call(d3.drag()
        .on("start", dragStarted)
        .on("drag", dragged)
        .on("end", dragEnded));

    // Node circles
    nodeElements.append("circle")
      .attr("r", d => d.radius)
      .attr("fill", d => d.color)
      .attr("fill-opacity", 0.85)
      .attr("stroke", d => d.isBrooklyn ? "#ffd700" : "rgba(255,255,255,0.2)")
      .attr("stroke-width", d => d.isBrooklyn ? 3 : 0.5)
      .attr("filter", d => d.isBrooklyn ? "url(#glow)" : null);

    // Bridge indicator (diamond shape behind circle)
    nodeElements.filter(d => d.isBridge && !d.isBrooklyn)
      .insert("rect", "circle")
      .attr("x", d => -d.radius - 3)
      .attr("y", d => -d.radius - 3)
      .attr("width", d => (d.radius + 3) * 2)
      .attr("height", d => (d.radius + 3) * 2)
      .attr("rx", 3)
      .attr("fill", "none")
      .attr("stroke", "rgba(255,255,255,0.3)")
      .attr("stroke-width", 1)
      .attr("stroke-dasharray", "3,2")
      .attr("class", "bridge-indicator")
      .style("display", "none");

    // Labels
    const labelElements = nodeElements.append("text")
      .text(d => d.id)
      .attr("dx", d => d.radius + 4)
      .attr("dy", 3)
      .attr("font-size", d => d.fontSize + "px")
      .attr("fill", d => d.isBrooklyn ? "#ffd700" : "rgba(255,255,255,0.7)")
      .attr("font-weight", d => d.isBrooklyn ? 700 : 400)
      .style("pointer-events", "none");

    // Tooltip
    const tooltip = document.getElementById("tooltip");

    nodeElements.on("mouseover", (event, d) => {
      const team = teamMap.get(d.id);
      if (!team) return;
      const tourneys = d.tournaments.join(", ");
      tooltip.innerHTML =
        '<div class="tt-name">' + d.id + '</div>' +
        '<div class="tt-stat">Rating: <span>' + d.rating.toFixed(1) + '</span> &middot; Rank: <span>#' + d.rank + '</span></div>' +
        '<div class="tt-stat">Record: <span class="' + (team.wins > team.losses ? 'tt-w' : 'tt-l') + '">' +
        team.wins + '-' + team.losses + '</span></div>' +
        '<div class="tt-stat">Tournaments: <span>' + tourneys + '</span></div>' +
        (d.isBridge ? '<div class="tt-stat" style="color:#f5a623">Bridge team (multi-tournament)</div>' : '');
      tooltip.style.display = "block";
      positionTooltip(event);

      // Highlight connected
      const connected = new Set();
      links.forEach(l => {
        const sName = typeof l.source === "object" ? l.source.id : l.source;
        const tName = typeof l.target === "object" ? l.target.id : l.target;
        if (sName === d.id) connected.add(tName);
        if (tName === d.id) connected.add(sName);
      });
      connected.add(d.id);

      nodeElements.select("circle")
        .attr("fill-opacity", n => connected.has(n.id) ? 1 : 0.15);
      labelElements
        .attr("fill-opacity", n => connected.has(n.id) ? 1 : 0.1);
      linkElements
        .attr("stroke", l => {
          const sName = typeof l.source === "object" ? l.source.id : l.source;
          const tName = typeof l.target === "object" ? l.target.id : l.target;
          return (sName === d.id || tName === d.id) ? "rgba(255,255,255,0.5)" : "rgba(255,255,255,0.03)";
        });
    })
    .on("mousemove", positionTooltip)
    .on("mouseout", () => {
      tooltip.style.display = "none";
      nodeElements.select("circle").attr("fill-opacity", 0.85);
      labelElements.attr("fill-opacity", 1);
      linkElements.attr("stroke", "rgba(255,255,255,0.12)");
    });

    // Edge hover
    linkElements.on("mouseover", (event, d) => {
      const games = d.games;
      let html = '<div class="tt-name">' +
        (typeof d.source === "object" ? d.source.id : d.source) + " vs " +
        (typeof d.target === "object" ? d.target.id : d.target) + '</div>' +
        '<div class="tt-games">';
      games.forEach(g => {
        const cls = g.result === "W" ? "tt-w" : "tt-l";
        html += '<div class="tt-game-line"><span class="' + cls + '">' +
          g.player + '</span> ' + g.score + ' (' + g.tournament + ')</div>';
      });
      html += '</div>';
      tooltip.innerHTML = html;
      tooltip.style.display = "block";
      positionTooltip(event);
      linkElements.attr("stroke-opacity", l => l === d ? 1 : 0.3);
      d3.select(event.target).attr("stroke", "rgba(255,255,255,0.7)");
    })
    .on("mousemove", positionTooltip)
    .on("mouseout", (event, d) => {
      tooltip.style.display = "none";
      linkElements.attr("stroke", "rgba(255,255,255,0.12)").attr("stroke-opacity", 1);
    });
    linkElements.style("pointer-events", "all").style("cursor", "pointer");

    function positionTooltip(event) {
      let x = event.clientX + 14;
      let y = event.clientY + 14;
      if (x + 300 > window.innerWidth) x = event.clientX - 300;
      if (y + 200 > window.innerHeight) y = event.clientY - 200;
      tooltip.style.left = x + "px";
      tooltip.style.top = y + "px";
    }

    // Simulation
    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(80).strength(0.3))
      .force("charge", d3.forceManyBody().strength(-120))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collision", d3.forceCollide().radius(d => d.radius + 3).strength(0.7))
      .force("x", d3.forceX(width / 2).strength(0.03))
      .force("y", d3.forceY(height / 2).strength(0.03))
      .on("tick", ticked);

    function ticked() {
      linkElements
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);
      nodeElements.attr("transform", d => "translate(" + d.x + "," + d.y + ")");
    }

    function dragStarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    }
    function dragged(event, d) {
      d.fx = event.x; d.fy = event.y;
    }
    function dragEnded(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }

    // Controls
    document.getElementById("toggle-labels").addEventListener("change", function() {
      labelElements.style("display", this.checked ? null : "none");
    });

    let bridgesHighlighted = false;
    document.getElementById("toggle-bridges").addEventListener("click", function() {
      bridgesHighlighted = !bridgesHighlighted;
      this.classList.toggle("active", bridgesHighlighted);
      nodeElements.selectAll(".bridge-indicator")
        .style("display", bridgesHighlighted ? null : "none");
      if (bridgesHighlighted) {
        nodeElements.select("circle")
          .attr("fill-opacity", d => d.isBridge ? 1 : 0.3);
        labelElements.attr("fill-opacity", d => d.isBridge ? 1 : 0.2);
      } else {
        nodeElements.select("circle").attr("fill-opacity", 0.85);
        labelElements.attr("fill-opacity", 1);
      }
    });

    document.getElementById("reset-zoom").addEventListener("click", () => {
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    });

    // --- Map view toggle ---
    let mapMode = false;
    document.getElementById("toggle-map").addEventListener("click", function() {
      mapMode = !mapMode;
      this.classList.toggle("active", mapMode);
      this.textContent = mapMode ? "Force layout" : "Map view";

      if (mapMode) {
        statesGroup.style("display", null);
        simulation.stop();

        // Fix nodes to geographic positions
        nodes.forEach(n => {
          const coord = TEAM_COORDS[n.id];
          if (coord) {
            const projected = projection(coord);
            if (projected) {
              n.fx = projected[0];
              n.fy = projected[1];
            }
          }
        });

        // Animate transition
        const dur = 1200;
        nodeElements.transition().duration(dur).ease(d3.easeCubicInOut)
          .attr("transform", d => "translate(" + (d.fx != null ? d.fx : d.x) + "," + (d.fy != null ? d.fy : d.y) + ")");
        linkElements.transition().duration(dur).ease(d3.easeCubicInOut)
          .attr("x1", d => d.source.fx != null ? d.source.fx : d.source.x)
          .attr("y1", d => d.source.fy != null ? d.source.fy : d.source.y)
          .attr("x2", d => d.target.fx != null ? d.target.fx : d.target.x)
          .attr("y2", d => d.target.fy != null ? d.target.fy : d.target.y);

        // After transition, sync x/y so tooltips etc. work
        setTimeout(() => {
          nodes.forEach(n => {
            if (n.fx != null) { n.x = n.fx; n.y = n.fy; }
          });
        }, dur + 50);

      } else {
        statesGroup.style("display", "none");

        // Release positions
        nodes.forEach(n => { n.fx = null; n.fy = null; });
        simulation.alpha(0.3).restart();
      }
    });

    // Touch support is built into d3.zoom and d3.drag
  </script>
</body>
</html>
